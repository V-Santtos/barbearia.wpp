<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lucas Costa Barbearia — Serviços</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #161616;
  --gold:  #c9a96e;
  --white: #f0ede8;
  --dim:   rgba(240, 237, 232, 0.38);
  --line:  rgba(240, 237, 232, 0.11);
}

html, body {
  background: var(--black);
  color: var(--white);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.card {
  max-width: 420px;
  margin: 0 auto;
  position: relative;
  background: var(--black);
  overflow: hidden;
}


.inner {
  position: relative;
  z-index: 1;
  padding: 48px 38px 44px;
}

/* ── logo ── */
.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.logo-wrap img {
  width: 96px;
  height: 96px;
  object-fit: contain;
}

/* ── header ── */
header {
  text-align: center;
  margin-bottom: 36px;
}

.rule {
  width: 32px;
  height: 1px;
  background: var(--gold);
  margin: 18px auto 14px;
}

.section-label {
  font-family: 'Courier New', Courier, monospace;
  font-size: 8.5px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ── services ── */
.services {
  margin-top: 28px;
  border-top: 1px solid var(--line);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.name {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 15px;
  font-weight: normal;
  color: var(--white);
  flex: 1;
  line-height: 1.35;
}

.price {
  font-family: 'Courier New', Courier, monospace;
  font-size: 13.5px;
  color: var(--gold);
  letter-spacing: 0.04em;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── corner numbers ── */
.corners {
  display: flex;
  justify-content: space-between;
  margin-top: 28px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 8px;
  letter-spacing: 0.15em;
  color: rgba(201, 169, 110, 0.28);
}

/* ── footer — só estrelas ── */
footer {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  text-align: center;
}

.deco {
  font-size: 14px;
  color: var(--gold);
  opacity: 0.60;
  letter-spacing: 0.55em;
}

/* ── print ── */
@media print {
  @page { size: 420px 720px; margin: 0; }
  html, body { background: var(--black) !important; height: auto; }
  .card { max-width: 100%; }
}
</style>
</head>
