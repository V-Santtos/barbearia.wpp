<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` põe o conteúdo por baixo do entalhe e da barra de
         gestos; quem devolve o respiro é o `env(safe-area-inset-*)` nos
         componentes (CalendarHeader, Sidebar, HamburgerPanel, o dock). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Mesmo `#1c1c1c` do manifesto e do `--color-background`. -->
    <meta name="theme-color" content="#1c1c1c" />
    <!-- A `apple-` está depreciada mas continua sendo a que o iOS lê; a outra é
         a padrão, e sem ela o Chrome reclama no relatório de instalação. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black-translucent`: a barra de status fica transparente e quem pinta é
         o iOS, que era o pedido. Mudar para `black` ou `default` volta a pintar
         uma faixa por cima do app. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Admin" />
    <!-- O iOS ignora o manifesto para o ícone da tela de início e lê esta tag.
         180×180 e opaco — ver `ferramentas/icones.mjs`. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Barbearia Admin</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #1c1c1c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
